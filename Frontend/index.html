<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="__APP_THEME_COLOR__" />
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('nova.theme-state') || '{}');
          const savedTheme = stored?.state?.theme;
          const theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <meta
      name="description"
      content="__APP_META_DESCRIPTION__"
    />
    <link rel="icon" href="__APP_FAVICON_PATH__" sizes="any" />
    <link rel="icon" href="__APP_FAVICON_32_PATH__" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="__APP_APPLE_TOUCH_ICON_PATH__" />
    <title>__APP_NAME__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
